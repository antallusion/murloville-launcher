# Сборка лаунчера.
#
# Собираем на GitHub Actions не ради удобства, а потому что этого требует
# бесплатная подпись от SignPath Foundation: они подписывают только то, что
# заведомо собрано из открытых исходников этого репозитория.

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Сборка
        working-directory: src
        run: dotnet publish -c Release -o ../out

      - name: Выложить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: MurloVille-launcher
          path: out/MurloVille.exe
          if-no-files-found: error
