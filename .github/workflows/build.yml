# Сборка лаунчера и установщика.
#
# Собираем на GitHub Actions не ради удобства, а потому что этого требует
# бесплатная подпись от SignPath Foundation: они подписывают только то, что
# заведомо собрано из открытых исходников этого репозитория.
#
# Inno Setup на образах windows-latest уже стоит, ставить его не нужно.

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Версия из проекта
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path src/MurloLauncher.csproj -Pattern '<Version>(.*?)</Version>'
          $v = $m.Matches[0].Groups[1].Value
          Write-Output "версия: $v"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Сборка лаунчера
        working-directory: src
        run: dotnet publish -c Release -o ../out

      - name: Сборка установщика
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DAppVersion=${{ steps.ver.outputs.version }} `
            installer\MurloVille.iss
          if ($LASTEXITCODE -ne 0) { throw "установщик не собрался" }

      - name: Выложить лаунчер
        uses: actions/upload-artifact@v4
        with:
          name: MurloVille-launcher
          path: out/MurloVille.exe
          if-no-files-found: error

      - name: Выложить установщик
        id: setup
        uses: actions/upload-artifact@v4
        with:
          name: MurloVille-setup
          path: dist/MurloVille-Setup-*.exe
          if-no-files-found: error

      # Подпись включится сама, как только в настройках репозитория появятся
      # секреты SignPath. Пока их нет, шаг пропускается и сборка остаётся
      # зелёной: держим его здесь, чтобы в день получения сертификата работа
      # свелась к добавлению двух секретов.
      #
      # Порядок важен: SignPath берёт уже выложенный артефакт по его номеру,
      # поэтому шаг обязан идти после выкладки, а не до.
      - name: Подпись установщика
        if: env.SIGNPATH_TOKEN != ''
        env:
          SIGNPATH_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: murloville-launcher
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Выложить подписанный установщик
        if: env.SIGNPATH_TOKEN != ''
        env:
          SIGNPATH_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        uses: actions/upload-artifact@v4
        with:
          name: MurloVille-setup-signed
          path: signed/*.exe
          if-no-files-found: error
